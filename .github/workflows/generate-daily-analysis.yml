name: Generate Daily Analysis (Gemini)

on:
  schedule:
    # 15分おき（update-signal.ymlと同じ間隔）。サイト表示「15分おき自動更新」の
    # 文言に実態を合わせるための設定。Gemini無料枠は1日1,500リクエストが目安のため、
    # 1日96回（本ワークフロー分のみ）は十分余裕がある。
    # ただしGitHub Actionsのスケジュール実行は指定間隔を厳密には守らないため、
    # 実際には数十分単位の前後がある（update-signal.ymlと同じ既知の制約）。
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # GitHubの画面から手動実行もできるようにする

permissions:
  contents: write

jobs:
  generate-daily-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # signal.jsonは15分おきの別ワークフロー(update-signal.yml)が更新済みのものを
      # そのまま読む（このワークフロー内で再計算はしない）。
      - name: Generate daily_analysis.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_daily_analysis.py

      - name: Commit daily_analysis.json
        run: |
          git config user.name "aifx-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily_analysis.json
          git diff --cached --quiet && echo "変更なし（生成失敗または内容同一）。コミットをスキップします。" || git commit -m "chore: generate daily_analysis.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main
          git push
