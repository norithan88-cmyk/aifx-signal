name: Generate Daily Analysis (Gemini)

on:
  schedule:
    # 東京時間 8:00 と 22:00 の1日2回（UTC換算: 23:00と13:00。JSTはUTC+9）。
    # 指標発表が集中する夜と、取引開始前の朝をカバーする。
    - cron: "0 23 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # GitHubの画面から手動実行もできるようにする

permissions:
  contents: write

jobs:
  generate-daily-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # signal.jsonは15分おきの別ワークフロー(update-signal.yml)が更新済みのものを
      # そのまま読む（このワークフロー内で再計算はしない）。
      - name: Generate daily_analysis.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_daily_analysis.py

      - name: Commit daily_analysis.json
        run: |
          git config user.name "aifx-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily_analysis.json
          git diff --cached --quiet && echo "変更なし（生成失敗または内容同一）。コミットをスキップします。" || git commit -m "chore: generate daily_analysis.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main
          git push
