name: Update AI FX Signal

on:
  schedule:
    # 5分おきに実行。2026-08-17、パターン4(1分足の反発検出)導入に伴い、
    # バックテスト時の判定精度(1分単位)により近づけるため15分おきから短縮した。
    # 1分おきも検討したが、(1)GitHub Actionsのスケジュール実行は指定間隔を
    # 厳密に守らず実行遅延が起きやすい (2)Yahoo Finance非公式APIへの呼び出しが
    # 15倍(1日96回→1440回)に増えレート制限(429)のリスクが上がる、という
    # 2つの理由で見送り、安全側の5分おきを採用している。
    # USD/JPYの価格・回帰チャネルは毎回更新されるが、米10年債・WTIは
    # 元データが日足のため1日1回しか実際にはAPIを呼ばない（スクリプト側で制御）。
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # GitHubの画面から手動実行もできるようにする

permissions:
  contents: write

jobs:
  update-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute signal
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python scripts/compute_signal.py

      - name: Commit signal.json and trade_log.json
        run: |
          git config user.name "aifx-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signal.json trade_log.json
          git diff --cached --quiet && echo "変更なし。コミットをスキップします。" || git commit -m "chore: update signal.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main
          git push

      # EUR/USD側はUSD/JPY版とは別ファイル(signal_eurusd.json)への追加機能。
      # continue-on-error: true にして、EUR/USD側で一時的な取得失敗が起きても
      # ジョブ全体を失敗扱いにしない（USD/JPY側は上のステップで既にpush済みのため無関係）。
      - name: Compute EUR/USD signal
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: python scripts/compute_signal_eurusd.py
        continue-on-error: true

      - name: Commit signal_eurusd.json
        run: |
          git add signal_eurusd.json
          git diff --cached --quiet && echo "変更なし。コミットをスキップします。" || git commit -m "chore: update signal_eurusd.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main
          git push
        continue-on-error: true
