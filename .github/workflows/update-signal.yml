name: Update AI FX Signal

on:
  schedule:
    # 毎日 06:30 JST (= 前日 21:30 UTC) に実行。米国市場が動き出す少し前の時間帯。
    - cron: "30 21 * * *"
  workflow_dispatch: {}  # GitHubの画面から手動実行もできるようにする

permissions:
  contents: write

jobs:
  update-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute signal
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: python scripts/compute_signal.py

      - name: Commit signal.json
        run: |
          git config user.name "aifx-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signal.json
          git diff --cached --quiet && echo "変更なし。コミットをスキップします。" || git commit -m "chore: update signal.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      - name: Purge jsDelivr cache
        # jsDelivr はファイルをキャッシュするため、更新のたびに明示的にパージして
        # サイト側がすぐ新しい signal.json を取得できるようにする。
        run: |
          REPO="${GITHUB_REPOSITORY}"
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/signal.json" || true
